[package]
name = "realcugan_rs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/rust/lib.rs"
crate-type = ["lib"]

[dependencies]
image = { version = "0.25.2", optional = true }
libc = "0.2.158"

[build-dependencies]
cmake = "^0.1.48"

[profile.release]
lto = true
opt-level = 3
strip = "debuginfo"
panic = "abort"
incremental = false

[features]
default = ["image", "models"]
image = ["dep:image"]
system-ncnn = []
models = ["models-se", "models-pro", "models-nose"]
models-se = []
models-pro = []
models-nose = []
